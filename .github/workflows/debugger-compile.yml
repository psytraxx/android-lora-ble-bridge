name: Debugger Firmware

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "debugger/**"
      - ".github/workflows/debugger-compile.yml"
  push:
    branches: [main]
    paths:
      - "debugger/**"
      - ".github/workflows/debugger-compile.yml"

jobs:
  test:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: debugger

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: pio run