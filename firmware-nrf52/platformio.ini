; PlatformIO Project Configuration File for nRF52 LoRa-BLE Bridge
;
; Compatible with ESP32 firmware - shares Protocol.cpp/h

[platformio]
default_envs = xiao_nrf52840

[env]
; Common settings for nRF52
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = arduino
monitor_speed = 115200

lib_deps =
    jgromes/RadioLib@7.4.0

build_flags =
    -Wall
    ; LoRa configuration (must match ESP32 for interoperability)
    -DLORA_FREQUENCY=433.92
    -DLORA_BANDWIDTH=250.0
    -DLORA_SPREADING_FACTOR=9
    -DLORA_CODING_RATE=5
    -DLORA_TX_POWER=20
    -DRADIO_SX1262

[env:xiao_nrf52840]
board = seeed-xiao-afruitnrf52-nrf52840

build_flags =
    ${env.build_flags}
    ; Device configuration
    -DDEVICE_NAME='"nRF52-LoRa (1)"'

    ; SX1262 LoRa module pins (Seeed XIAO nRF52840)
    -DLORA_SCK=26       ; P0.26 (Arduino D8)
    -DLORA_MISO=29      ; P0.29 (Arduino D9)
    -DLORA_MOSI=2       ; P0.02 (Arduino D10)
    -DLORA_SS=3         ; P0.03 (Arduino D0)
    -DLORA_RST=28       ; P0.28 (Arduino D1)
    -DLORA_DIO0=4       ; P0.04 (Arduino D2) - IRQ
    -DLORA_BUSY=5       ; P0.05 (Arduino D3)

    ; Status LED (built-in on XIAO)
    -DLED_PIN=LED_BUILTIN

    ; Wake button (optional)
    -DWAKE_BUTTON=6     ; P0.06 (Arduino D4)

    ; Battery monitoring
    -DBATTERY_ADC_PIN=31           ; P0.31 (VBAT/2)
    -DBATTERY_VOLTAGE_DIVIDER=2.0

lib_deps =
    ${env.lib_deps}

; Debug configuration
debug_tool = cmsis-dap
debug_init_break = tbreak setup
