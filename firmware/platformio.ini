; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common configuration for all ESP32 variants
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
lib_deps =
	jgromes/RadioLib@^7.4.0
	h2zero/NimBLE-Arduino@^2.3.6
	adafruit/Adafruit SleepyDog Library@^1.6.5
lib_extra_dirs =
	~/.platformio/lib
build_flags =
	-Wall
	-Wunused
	; LoRa configuration (RadioLib compatible)
	; meshtastic_Config_LoRaConfig_ModemPreset_MEDIUM_FAST
	-DLORA_FREQUENCY=433.92
	-DLORA_BANDWIDTH=250.0
	-DLORA_SPREADING_FACTOR=9
	-DLORA_CODING_RATE=5
	-DLORA_TX_POWER=20
lib_ldf_mode = deep+
monitor_speed = 115200
extra_scripts = pre:generate_device_name.py

[env:lilygo-t-display-s3]
board = lilygo-t-display-s3
build_src_filter =
    +<unified_main.cpp>
    +<Protocol.cpp>
    +<ApplicationController.cpp>
    +<LoRaManager.cpp>
    +<esp32/*.cpp>
build_flags =
	${env.build_flags}
	-DLORA_SCK=12
    -DLORA_MISO=13
    -DLORA_MOSI=11
    -DLORA_SS=10
    -DLORA_RST=43
    -DLORA_DIO0=3
	-DLORA_BUSY=0
	-DWAKE_BUTTON=14
	-DDEVICE_NAME='"ESP32S3-LoRa"'
	-DRADIO_SX1278
	; Battery monitoring (LilyGo T-Display S3)
	-DBATTERY_ADC_PIN=4
	-DBATTERY_VOLTAGE_DIVIDER=2.0  

;http://community.heltec.cn/t/heltec-v3-and-wsl-v3-i2c-pins/12382
[env:heltec-wifi-lora-v3]
board = heltec_wifi_lora_32_V3
board_build.partitions = default_8MB.csv
build_src_filter =
    +<unified_main.cpp>
    +<Protocol.cpp>
    +<ApplicationController.cpp>
    +<LoRaManager.cpp>
    +<esp32/*.cpp>
build_flags =
	${env.build_flags}
	-DLORA_SCK=9
    -DLORA_MISO=11
    -DLORA_MOSI=10
    -DLORA_SS=8
    -DLORA_RST=12
    -DLORA_DIO0=14
	-DLORA_BUSY=13
	-DLED_PIN=35
	-DWAKE_BUTTON=0
	-DVEXT_PIN=36
	-DDEVICE_NAME='"HellTecLite-LoRa"'
	-DRADIO_SX1262
	; Battery monitoring (Heltec WiFi LoRa v3)
	-DBATTERY_ADC_PIN=1
	-DBATTERY_ADC_CTRL=37
	-DBATTERY_VOLTAGE_DIVIDER=4.9
	;-DRADIOLIB_DEBUG_BASIC=1

[env:xiao_nrf52840]
; nRF52 environment for Seeed XIAO nRF52840
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = arduino
board = seeed-xiao-afruitnrf52-nrf52840
monitor_speed = 115200

lib_deps =
    jgromes/RadioLib@7.4.0
    adafruit/Adafruit SleepyDog Library@^1.6.5
    https://github.com/adafruit/Adafruit_nRF52_Arduino
build_flags =
    -Wall
    ; LoRa configuration (must match ESP32 for interoperability)
    -DLORA_FREQUENCY=433.92
    -DLORA_BANDWIDTH=250.0
    -DLORA_SPREADING_FACTOR=9
    -DLORA_CODING_RATE=5
    -DLORA_TX_POWER=20
    -DRADIO_SX1268
    ; Device configuration
    -DDEVICE_NAME='"nRF52-LoRa"'
    ; SX1268 LoRa module pins (Seeed XIAO nRF52840)
    -DLORA_SCK=13       ; P0.13 (Arduino D8)
    -DLORA_MISO=14      ; P0.14 (Arduino D9)
    -DLORA_MOSI=15      ; P0.15 (Arduino D10)
    -DLORA_SS=D4      ; P0.04 (Arduino D4)
    -DLORA_RST=D2       ; P0.28 (Arduino D2)
    -DLORA_DIO0=D1       ; P0.03 (Arduino D1)
    -DLORA_BUSY=D3      ; P0.29 (Arduino D3)
    -DLORA_RXEN=D5     ; P0.05 (Arduino D5)
    ; Status LED (built-in on XIAO)
    -DLED_PIN=LED_BLUE
    ; Wake button (optional)
    -DWAKE_BUTTON=0     ; P0.06 (Arduino D4)
    ; Battery monitoring (Seeed XIAO nRF52840)
    ; PIN_VBAT reads battery through hardware voltage divider (~2:1)
    ; VBAT_ENABLE must be set LOW to enable reading, HIGH to disable (save power)
    -DBATTERY_ADC_PIN=PIN_VBAT
    -DBATTERY_ADC_CTRL=VBAT_ENABLE
    -DBATTERY_VOLTAGE_DIVIDER=2
    -DRADIOLIB_DEBUG_BASIC=1

build_src_filter =
    +<unified_main.cpp>
    +<Protocol.cpp>
    +<ApplicationController.cpp>
    +<LoRaManager.cpp>
    +<nrf52/*.cpp>

; Debug configuration
debug_tool = cmsis-dap
debug_init_break = tbreak setup